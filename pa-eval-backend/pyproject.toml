[project]
name = "pa-eval-backend"
version = "0.1.0"
description = "PA Eval backend adapter for Langfuse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.40,<2",
    "cryptography>=49.0.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.2",
    "py-openjudge>=0.2.4",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.32",
    "redis>=6,<7",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
