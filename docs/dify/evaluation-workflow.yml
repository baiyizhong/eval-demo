app:
  description: Evaluate an input/output pair with optional metadata and return a score plus reason.
  icon: 🧪
  icon_background: '#E0EAFF'
  icon_type: emoji
  mode: workflow
  name: Evaluation Judge
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-to-judge-llm
      source: start_node
      sourceHandle: source
      target: judge_llm_node
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: judge-llm-to-parse-json
      source: judge_llm_node
      sourceHandle: source
      target: parse_json_node
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: parse-json-to-end
      source: parse_json_node
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Inputs
        type: start
        variables:
        - default: ''
          hint: The original prompt, question, task, or expected instruction.
          label: input
          max_length: null
          options: []
          placeholder: Enter the original input to evaluate against.
          required: true
          type: paragraph
          variable: input
        - default: ''
          hint: The generated answer or result that should be evaluated.
          label: output
          max_length: null
          options: []
          placeholder: Enter the output to score.
          required: true
          type: paragraph
          variable: output
        - default: ''
          hint: Optional context such as rubric, expected answer, labels, source data, or JSON metadata.
          label: metadata
          max_length: null
          options: []
          placeholder: Enter optional metadata or leave empty.
          required: false
          type: paragraph
          variable: metadata
      height: 142
      id: start_node
      position:
        x: 30
        y: 227
      positionAbsolute:
        x: 30
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Score the candidate output against the input and metadata.
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        model:
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - role: system
          text: |-
            你是一个严格、客观的评测裁判。

            请根据 input、output 和 metadata，评估候选 output 是否满足 input 的要求，以及 metadata 中的约束、参考答案或评分标准。

            只能返回合法 JSON，不要输出 Markdown、解释文字或代码块。JSON 必须严格符合以下结构：
            {
              "score": 0.0,
              "reason": "简短评分理由"
            }

            评分规则：
            - score 必须是 0 到 1 之间的数字。
            - 1.0 表示完全正确、完整、满足全部要求。
            - 0.7 表示基本正确，但存在轻微问题或遗漏。
            - 0.4 表示部分正确，但存在明显缺陷或关键遗漏。
            - 0.0 表示错误、不相关、空输出、不安全，或完全不满足要求。
            - reason 使用中文，简洁说明评分依据，指出主要优点和问题。
        - role: user
          text: |-
            Input:
            {{#start_node.input#}}

            Candidate output:
            {{#start_node.output#}}

            Metadata:
            {{#start_node.metadata#}}
        retry_config:
          enabled: false
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 1
          retry_interval: 1000
        selected: false
        structured_output:
          enabled: false
        title: Judge LLM
        type: llm
        vision:
          configs:
            variable_selector: []
          enabled: false
      height: 118
      id: judge_llm_node
      position:
        x: 334
        y: 227
      positionAbsolute:
        x: 334
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re


          def main(judge_text: str) -> dict:
              raw = judge_text.strip()

              try:
                  payload = json.loads(raw)
              except Exception:
                  match = re.search(r"\{.*\}", raw, re.DOTALL)
                  if not match:
                      return {
                          "score": 0,
                          "reason": "Judge model did not return JSON.",
                      }
                  try:
                      payload = json.loads(match.group(0))
                  except Exception:
                      return {
                          "score": 0,
                          "reason": "Judge model returned malformed JSON.",
                      }

              score_value = payload.get("score", 0)
              try:
                  score = float(score_value)
              except Exception:
                  score = 0
              score = max(0, min(1, score))

              reason = payload.get("reason", "")
              if not isinstance(reason, str):
                  reason = json.dumps(reason, ensure_ascii=False)

              return {
                  "score": score,
                  "reason": reason,
              }
        code_language: python3
        desc: Parse and normalize the judge JSON response.
        outputs:
          reason:
            children: null
            type: string
          score:
            children: null
            type: number
        selected: false
        title: Parse JSON
        type: code
        variables:
        - value_selector:
          - judge_llm_node
          - text
          value_type: string
          variable: judge_text
      height: 90
      id: parse_json_node
      position:
        x: 638
        y: 227
      positionAbsolute:
        x: 638
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - parse_json_node
          - score
          value_type: number
          variable: score
        - value_selector:
          - parse_json_node
          - reason
          value_type: string
          variable: reason
        selected: false
        title: Outputs
        type: end
      height: 118
      id: end_node
      position:
        x: 942
        y: 227
      positionAbsolute:
        x: 942
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
